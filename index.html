<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Games Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/apps/hub/hub.css" />
  </head>
  <body>
    <main>
      <header class="hub-header">
        <div class="hub-title-group">
          <h1 class="hub-title">Games Hub</h1>
          <p class="hub-subtitle">
            A minimal multi-game playground. Pick a game to jump in.
          </p>
        </div>
        <div class="hub-meta">
          <span class="hub-pill">Vanilla JS • Vite</span>
        </div>
      </header>

      <section aria-label="Available games">
        <div id="games-grid" class="games-grid"></div>
      </section>
    </main>

    <script type="module" src="/apps/hub/hub.js"></script>
  </body>
</html>
