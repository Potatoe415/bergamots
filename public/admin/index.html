<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin — Mucho Games</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <main class="admin-shell">
      <h1 class="admin-title" data-id="admin-page-title">Admin</h1>

      <section
        class="admin-card admin-login"
        id="admin-login"
        data-id="admin-login-section"
      >
        <form
          id="admin-login-form"
          data-id="admin-login-form"
          autocomplete="off"
        >
          <label class="admin-label" for="admin-password-input"
            >Mot de passe</label
          >
          <input
            class="admin-input"
            id="admin-password-input"
            data-id="admin-password-input"
            type="password"
            required
            autocomplete="current-password"
          />
          <button
            class="admin-button"
            type="submit"
            data-id="admin-login-submit"
          >
            Entrer
          </button>
        </form>
        <p
          class="admin-error"
          id="admin-error"
          data-id="admin-error-banner"
          hidden
        ></p>
      </section>

      <section
        class="admin-card"
        id="admin-dashboard"
        data-id="admin-dashboard-section"
        hidden
      >
        <header class="admin-dashboard-header">
          <div>
            <p class="admin-metric-label">Lancements de jeux</p>
            <p
              class="admin-metric-value"
              id="admin-total-launches"
              data-id="admin-total-launches"
            >
              —
            </p>
            <p
              class="admin-metric-caption"
              id="admin-range-caption"
              data-id="admin-range-caption"
            ></p>
          </div>
          <div class="admin-actions">
            <button
              class="admin-button admin-button--ghost"
              type="button"
              id="admin-refresh-button"
              data-id="admin-refresh-button"
            >
              Rafraîchir
            </button>
            <button
              class="admin-button admin-button--ghost"
              type="button"
              id="admin-logout-button"
              data-id="admin-logout-button"
            >
              Quitter
            </button>
          </div>
        </header>

        <div
          class="admin-range"
          id="admin-range-switch"
          data-id="admin-range-switch"
          role="group"
          aria-label="Période affichée"
        >
          <button
            class="admin-range-option"
            type="button"
            data-range="7d"
            data-id="admin-range-7d"
          >
            7 jours
          </button>
          <button
            class="admin-range-option"
            type="button"
            data-range="30d"
            data-id="admin-range-30d"
          >
            30 jours
          </button>
          <button
            class="admin-range-option"
            type="button"
            data-range="6m"
            data-id="admin-range-6m"
          >
            6 mois
          </button>
        </div>

        <h2 class="admin-section-title">Tendance quotidienne</h2>
        <div
          class="admin-trend"
          id="admin-trend"
          data-id="admin-trend-chart"
        ></div>

        <h2 class="admin-section-title">Classement des jeux</h2>
        <ol
          class="admin-ranking"
          id="admin-ranking"
          data-id="admin-ranking-list"
        ></ol>
        <p
          class="admin-empty"
          id="admin-empty"
          data-id="admin-empty-state"
          hidden
        >
          Aucun lancement enregistré pour le moment.
        </p>
      </section>

      <a class="admin-back" href="/" data-id="admin-back-to-hub"
        >← Retour au hub</a
      >
    </main>

    <script type="module" src="/admin/admin.js"></script>
  </body>
</html>
