<!DOCTYPE html>
<!-- copied from
https://github.com/chrismaltby/gb-studio/blob/v2beta/appData/js-emulator/index.html
(see LICENSE.gbstudio)

Mobile-first touch controller added below the emulator screen (PHASE 1/2):
see #controller in this file, simple.css, and the bindTouch()/handleTouch*()
code in simple.js.
-->
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#031921" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/simple.css">
  <title>GameBoy Web</title>
</head>
<body>
  <div id="app">
    <div id="splash">
      <a href="/" id="hubBackLink" class="hubBackLink" data-id="gameboy-back-to-hub" data-i18n-title="hub_back" title="Back to hub">&#11013;</a>
      <div id="splash_console">
        <div id="splash_led" aria-hidden="true"></div>

        <button id="splashMenuBtn" data-i18n-title="menu_title_attr" title="Menu">&#9776;</button>
        <div id="splashMenu" hidden>
          <button class="gameMenuItem" id="splashMenuColorsBtn" data-action="colors" data-i18n="menu_colors">Colors...</button>
          <button class="gameMenuItem" id="splash_help_link" data-action="help" data-i18n="splash_help_link">View keyboard controls (PC)</button>
          <button class="gameMenuItem" id="splash_language_link" data-action="language" data-i18n="splash_language_link">Language / Langue</button>
        </div>

        <div id="splash_brand" aria-hidden="true">
          <div id="splash_logo"><span>GAME</span><span id="splash_logo_boy">BOY</span></div>
          <div id="splash_logo_stripe"></div>
        </div>

        <div id="splash_screen">
          <div id="splash_title">GameBoy Web</div>
          <div id="splash_subtitle" data-i18n="splash_subtitle">Choose a cartridge</div>
          <div id="splash_list"><!-- filled from opened ROM files --></div>
          <div id="splash_empty" data-i18n-html="splash_empty_html" hidden></div>
          <input type="file" id="openRomInput" accept=".gb,.gbc" multiple hidden>
          <button type="button" id="openRomBtn" data-id="gameboy-open-rom" data-i18n="open_rom">Open ROM file</button>
        </div>

        <div id="splash_speaker" aria-hidden="true"></div>
      </div>
    </div>

    <div id="game">
      <div id="gameHeader" hidden>
        <button class="headerIconBtn" data-action="quit" data-i18n-title="menu_quit" title="Back to game selection">&#11013;</button>
        <button class="headerIconBtn" id="headerPauseBtn" data-action="pause" title="Pause">&#9208;</button>
        <button class="headerIconBtn" id="headerMuteBtn" data-action="mute" title="Mute">&#128266;</button>
        <button class="headerIconBtn" data-action="save" data-i18n-title="menu_save" title="Save">&#128190;</button>
        <button class="headerIconBtn" data-action="load" data-i18n-title="menu_load" title="Load">&#128229;</button>
        <button class="headerIconBtn" data-action="reset" data-i18n-title="menu_reset" title="Reset">&#8635;</button>
        <button class="headerIconBtn" data-action="language" data-i18n-title="menu_language" title="Language">&#127760;</button>
      </div>
      <button id="menuBtn" data-i18n-title="menu_title_attr" title="Menu" hidden>&#9776;</button>
      <div id="gameMenu" hidden>
        <button class="gameMenuItem" data-action="colors" data-i18n="menu_colors">Colors...</button>
        <button class="gameMenuItem" id="menuExportSaveBtn" data-action="exportSave" data-i18n="menu_export_save">Export save (.sav)</button>
        <button class="gameMenuItem" data-action="importSave" data-i18n="menu_import_save">Import save (.sav)</button>
        <button class="gameMenuItem" data-action="help" data-i18n="menu_help">Controls (keyboard)</button>
      </div>
      <canvas id="mainCanvas" width="160" height="144">No Canvas Support</canvas>
      <input type="file" id="importSaveInput" accept=".sav" hidden>
    </div>

    <div id="controller">
      <div id="controller_dpad">
        <div id="controller_ul" class="dpadDiag dpadDiag-ul"></div>
        <div id="controller_up" class="dpadBtn dpadBtn-up"></div>
        <div id="controller_ur" class="dpadDiag dpadDiag-ur"></div>
        <div id="controller_left" class="dpadBtn dpadBtn-left"></div>
        <div id="controller_right" class="dpadBtn dpadBtn-right"></div>
        <div id="controller_dl" class="dpadDiag dpadDiag-dl"></div>
        <div id="controller_down" class="dpadBtn dpadBtn-down"></div>
        <div id="controller_dr" class="dpadDiag dpadDiag-dr"></div>
      </div>

      <div id="controller_actions">
        <div class="controllerDot controllerDot-actionsTop"></div>
        <div class="controllerDot controllerDot-actionsBottom"></div>
        <div id="controller_b" class="roundBtn roundBtn-b">B</div>
        <div id="controller_a" class="roundBtn roundBtn-a">A</div>
      </div>

      <div id="controller_meta">
        <div id="controller_select" class="capsuleBtn">Select</div>
        <div id="controller_start" class="capsuleBtn">Start</div>
      </div>
    </div>
  </div>

  <div id="helpDialog" class="dialogOverlay" hidden>
    <div class="dialogCard">
      <div class="dialogTitle" id="helpDialogTitle" data-i18n="help_title">Keyboard controls (PC)</div>
      <table id="helpTable" class="helpTable"><!-- rempli dynamiquement --></table>
      <button id="helpCloseBtn" class="dialogCloseBtn" data-i18n="dialog_close">Close</button>
    </div>
  </div>

  <div id="languageDialog" class="dialogOverlay" hidden>
    <div class="dialogCard">
      <div class="dialogTitle" data-i18n="lang_dialog_title">Language</div>
      <div id="languageOptions">
        <button class="langOption" data-lang="en">English</button>
        <button class="langOption" data-lang="fr">Français</button>
      </div>
      <button id="languageCloseBtn" class="dialogCloseBtn" data-i18n="dialog_close">Close</button>
    </div>
  </div>

  <div id="colorsDialog" class="dialogOverlay" hidden>
    <div class="dialogCard dialogCard-wide">
      <div class="dialogTitle" data-i18n="colors_dialog_title">Colors</div>
      <div class="dialogSubtitle" data-i18n="colors_dialog_subtitle">
        Pick a palette. For an original Game Boy game, choose "Game Boy
        (original green)" below.
      </div>
      <div id="colorOptions"><!-- rempli dynamiquement --></div>
      <button id="colorsCloseBtn" class="dialogCloseBtn" data-i18n="dialog_close">Close</button>
    </div>
  </div>

  <script src="vendor/binjgb.js"></script>
  <script src="vendor/simple.js"></script>
</body>
