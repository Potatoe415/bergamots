<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Games Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/shared/css/base.css" />
    <link rel="stylesheet" href="/apps/hub/hub.css" />
  </head>
  <body>
    <header class="hub-header">
      <div class="hub-header-inner">
        <div class="hub-header-left">
          <div class="hub-banner">
            <img
              src="/public/assets/banner.jpg"
              alt="Games Hub"
              class="hub-banner-image"
            />
            <span class="hub-banner-fallback">Games Hub</span>
          </div>
          <p class="hub-subtitle">
            Pick a game and jump in. Everything here is powered by vanilla
            JavaScript.
          </p>
        </div>
        <div class="hub-header-right">
          <div
            class="hub-lang-toggle"
            role="group"
            aria-label="Select interface language"
          >
            <button
              type="button"
              class="lang-toggle"
              data-lang="en"
              data-lang-toggle
              aria-label="Switch language to English"
            >
              🇬🇧
            </button>
            <button
              type="button"
              class="lang-toggle"
              data-lang="fr"
              data-lang-toggle
              aria-label="Basculer la langue en français"
            >
              🇫🇷
            </button>
            <button
              type="button"
              class="lang-toggle"
              data-lang="es"
              data-lang-toggle
              aria-label="Cambiar el idioma a español"
            >
              🇪🇸
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="main-with-fixed-header">
      <section aria-label="Available games">
        <div id="games-grid" class="games-grid"></div>
      </section>
    </main>

    <script type="module" src="/apps/hub/hub.js"></script>
  </body>
</html>
