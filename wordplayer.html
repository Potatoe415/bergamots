<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Word Player</title>
  <link rel="stylesheet" href="./shared/css/base.css">
  <link rel="stylesheet" href="./shared/css/wordplayer.css">
</head>
<body class="game-body">
  
  <header class="game-nav">
    <div class="nav-side nav-left">
      <a href="./index.html" class="back-button">←</a>
    </div>
    <div class="nav-center">
      <img id="game-banner" src="" alt="Logo" class="nav-banner">
    </div>
    <div class="nav-side nav-right">
      <div id="score-display" class="score-display" style="display: none;">0</div>
      <div id="lang-selector" class="lang-selector"></div>
      <button
        id="rules-button"
        class="floating-info-button"
        type="button"
        aria-label="Afficher les règles du jeu"
        style="display: none;"
      >
        i
      </button>
    </div>
  </header>

  <main class="game-container">
    <section class="game-interface">
      <div id="timer-display" class="timer-display"></div>
      <div id="word-display" class="word-card"></div>
      <div id="controls-container" class="controls"></div>
    </section>
  </main>

  <script type="module" src="./wordplayer.js"></script>
</body>
</html>
